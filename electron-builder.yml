appId: com.cursorhub.app
productName: CursorHub
directories:
  buildResources: build
  output: dist
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
dmg:
  title: "CursorHub ${version}"
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
files:
  - out/**/*
  - node_modules/**/*
  - docs/**/*
